services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wms-backend-app
    container_name: wms-backend-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - wms-network

  db:
    image: mysql:8.0
    container_name: wms-backend-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wmsmuhamad
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: user
    volumes:
      - wms-dbdata:/var/lib/mysql
    networks:
      - wms-network

  webroot:
    image: nginx:alpine
    container_name: wms-backend-web
    restart: unless-stopped
    ports:
      - "49978:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - wms-network
    depends_on:
      - app
      - db

networks:
  wms-network:
    name: wms-network
    driver: bridge

volumes:
  wms-dbdata:
    driver: local
